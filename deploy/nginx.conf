# POKYH website: serves the static export (`next build` → out/).
#
# Everything a Next server did for the website happens here now: security
# headers, the language of an address, old links, the detail pages with an id
# and caching. The same rules for Cloudflare Pages and similar hosts are in
# public/_headers and public/_redirects — keep both in step.
#
# __FALLBACK_LOCALE__ is replaced when the image is built
# (NEXT_PUBLIC_FALLBACK_LOCALE, default en), as in lib/i18n/locale.ts.

# The language a visitor gets for an address without one: the one chosen
# before (pokyh_locale), else the first of the browser's languages the site
# has, else the fallback. Ladin is retired and never chosen.
map $cookie_pokyh_locale $pokyh_cookie_lang {
    default "";
    de de;
    it it;
    en en;
}

map $http_accept_language $pokyh_browser_lang {
    default __FALLBACK_LOCALE__;
    # The earliest entry that is one of the site's languages.
    "~*^(?:[^,]*?,)*?\s*(de|it|en)(?:[-_;,\s]|$)" $1;
}

map $pokyh_cookie_lang $pokyh_lang {
    "" $pokyh_browser_lang;
    default $pokyh_cookie_lang;
}

server {
    listen 3011;
    listen [::]:3011;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    charset utf-8;
    # Relative redirects: the public scheme and host stay those of the proxy
    # or tunnel in front.
    absolute_redirect off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/javascript application/json application/manifest+json
               application/xml image/svg+xml model/gltf+json;

    error_page 404 /404.html;

    include /etc/nginx/pokyh/headers.conf;
    # Pages are always asked for again (cheaply, by ETag), so a new version is
    # there at once; the files they load have content hashes and are kept.
    add_header Cache-Control "no-cache" always;

    location = /404.html {
        internal;
        include /etc/nginx/pokyh/headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # Files for other hosts, not for visitors.
    location ~ ^/(_headers|_redirects)$ {
        return 404;
    }

    # ── Assets ───────────────────────────────────────────────────────────────

    location /_next/static/ {
        include /etc/nginx/pokyh/headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The 3D model (immutable, content-hashed by file name).
    location /models/ {
        include /etc/nginx/pokyh/headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ~ ^/(icon-[^/]+\.png|favicon\.ico|apple-icon\.png)$ {
        include /etc/nginx/pokyh/headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    location = /POKYH_Logo.png {
        include /etc/nginx/pokyh/headers.conf;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=2592000" always;
        try_files $uri =404;
    }

    # The service worker must always be the current one.
    location = /sw.js {
        include /etc/nginx/pokyh/headers.conf;
        add_header Cache-Control "no-cache" always;
        add_header Service-Worker-Allowed "/" always;
        try_files $uri =404;
    }

    # Generated link-preview images and icons are files without an extension.
    location ~ /(opengraph-image|twitter-image|icon|apple-icon)(-[\w-]+)?$ {
        include /etc/nginx/pokyh/headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        default_type image/png;
        try_files $uri =404;
    }

    # Static answers for the apps (/api/privacy-notice) and the website
    # (/api/legal/contact): written when the website was built.
    location /api/ {
        include /etc/nginx/pokyh/headers.conf;
        add_header Cache-Control "public, max-age=300" always;
        default_type application/json;
        try_files $uri $uri.json =404;
    }

    # ── Old links ────────────────────────────────────────────────────────────

    # Short links used by the iOS app and App Store Connect.
    location = /datenschutz {
        return 302 /$pokyh_lang/legal/datenschutz/;
    }
    location = /nutzungsbedingungen {
        return 302 /$pokyh_lang/legal/nutzungsbedingungen/;
    }

    # The legal texts used to be one page with ?view=<text> (and ?lang=);
    # each has its own page now: one permanent redirect to the clean address.
    location ~ ^/(?:(?<plang>de|it|en|lld)/)?legal/?$ {
        set $legal_lang $pokyh_lang;
        if ($plang ~ ^(de|it|en)$) {
            set $legal_lang $plang;
        }
        if ($arg_lang ~ ^(de|it|en)$) {
            set $legal_lang $arg_lang;
        }
        if ($arg_view ~ ^(impressum|datenschutz|nutzungsbedingungen|cookies|learn)$) {
            return 308 /$legal_lang/legal/$arg_view/;
        }
        if ($plang !~ ^(de|it|en)$) {
            return 302 /$legal_lang/legal/$is_args$args;
        }
        try_files $uri $uri/ =404;
    }

    # Ladin is retired: its addresses land on the German page.
    location ~ ^/lld(?<rest>/.*)?$ {
        return 301 /de$rest$is_args$args;
    }

    # ── Pages ────────────────────────────────────────────────────────────────

    # The root: on to the visitor's language.
    location = / {
        add_header Vary "Cookie, Accept-Language" always;
        add_header Cache-Control "no-store" always;
        return 302 /$pokyh_lang/;
    }

    # A language without its slash.
    location ~ ^/(?<l>de|it|en)$ {
        return 301 /$l/$is_args$args;
    }

    # The start address of apps installed before it became /home/
    # (app/manifest.ts): still signed in (pokyh_user), straight into the app;
    # otherwise to the sign-in page. One step either way, instead of the
    # sign-in page loading only to send on to the app.
    location ~ ^/login/?$ {
        add_header Vary "Cookie, Accept-Language" always;
        add_header Cache-Control "no-store" always;
        if ($cookie_pokyh_user) {
            return 302 /$pokyh_lang/home/;
        }
        return 302 /$pokyh_lang/login/$is_args$args;
    }

    # Detail pages with an id (lib/route-id.ts): each is built once for the id
    # "_"; every id gets that page and its navigation data, and the page reads
    # the real id from the address.
    #
    # An id never contains a dot (message and subject ids are numbers, dish ids
    # slugs), the build's own files always do: /de/messages/index.txt and
    # /de/messages/__next.*.txt belong to the message list and must be served
    # as they are. Only files are tried here, never a folder (a folder would
    # send the request back into this location in a loop).
    location ~ "^/(?<l>de|it|en)/(?<sect>messages|mensa/dish|canteen/dish|grades/subject)/(?<id>[^/.]+)$" {
        return 301 /$l/$sect/$id/$is_args$args;
    }
    location ~ "^/(?<l>de|it|en)/(?<sect>messages|mensa/dish|canteen/dish|grades/subject)/(?<id>[^/.]+)/$" {
        try_files /$l/$sect/_/index.html =404;
    }
    location ~ "^/(?<l>de|it|en)/(?<sect>messages|mensa/dish|canteen/dish|grades/subject)/(?<id>[^/.]+)/(?<file>.+)$" {
        try_files $uri /$l/$sect/_/$file =404;
    }

    # Every other page of a language; /de/about → /de/about/ for folders.
    location ~ ^/(de|it|en)/ {
        try_files $uri $uri/ =404;
    }

    # Everything else: a file of the site, or an address without a language
    # (/home, an old link) that goes on to the same address under one.
    location / {
        try_files $uri @without_language;
    }

    location @without_language {
        # A missing file stays missing; only page addresses get a language.
        if ($uri ~ "\.[A-Za-z0-9]+$") {
            return 404;
        }
        add_header Vary "Cookie, Accept-Language" always;
        add_header Cache-Control "no-store" always;
        return 302 /$pokyh_lang$uri$is_args$args;
    }
}
