# Security headers of every answer (included in each location of nginx.conf:
# nginx drops the server's add_header lines in a location that has its own).
# The same as public/_headers for other hosts.

# HTTPS only for two years, subdomains included, preload list.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
# Never inside another site's frame (clickjacking).
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
# Files from other sites (the dish photos of recipe sites) load without
# cookies, and the cookies they set are not kept: no third-party cookies
# through them. The API's own images load with CORS and the sign-in's cookies
# (crossOrigin="use-credentials", components/app/Avatar.tsx).
add_header Cross-Origin-Embedder-Policy "credentialless" always;
# Legacy browsers.
add_header X-XSS-Protection "1; mode=block" always;
# The parts of a Content-Security-Policy that cannot break the site: no plugins,
# no injected <base>, forms post only here, no framing by other sites. Scripts
# are not restricted (inline start-up scripts, consent-gated analytics).
add_header Content-Security-Policy "object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
