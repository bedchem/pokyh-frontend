services:
  # The website: a static export served by nginx (Dockerfile, deploy/nginx.conf).
  # Everything is decided when the image is built (the NEXT_PUBLIC_* values);
  # the container needs no secrets and no environment.
  web:
    build:
      context: .
      args:
        - NEXT_PUBLIC_API_KEY
        - NEXT_PUBLIC_SITE_URL
        - NEXT_PUBLIC_DEBUG_API
        - NEXT_PUBLIC_API_BACKEND_URL
        - NEXT_PUBLIC_SOURCE_URL
        - NEXT_PUBLIC_FALLBACK_LOCALE
        - NEXT_PUBLIC_SCROLL_TUNING
        - NEXT_PUBLIC_WEEK_ROLLOVER
        - NEXT_STALE_DYNAMIC
        - NEXT_STALE_STATIC
        - NEXT_PUBLIC_VAPID_PUBLIC_KEY
        - LEGAL_ENTITY_NAME
        - LEGAL_OPERATOR_NAME
        - LEGAL_CONTACT_EMAIL
        - LEGAL_PRIVACY_EMAIL
        - LEGAL_ADDRESS_LINE_1
        - LEGAL_ADDRESS_LINE_2
        - LEGAL_REPRESENTATIVE
        - LEGAL_VAT_ID
        - LEGAL_COMPANY_REGISTER
        - LEGAL_REA_NUMBER
        - LEGAL_PEC
        - NEXT_PUBLIC_GA_ID
        - NEXT_PUBLIC_SUPPORT_URL
        - NEXT_PUBLIC_COMMENT_MAX_LENGTH
        - NEXT_PUBLIC_WORD_FILTER_BLOCK
        - NEXT_PUBLIC_WORD_FILTER_ALLOW
        - MENSA_API_URL
        - MENSA_API_KEY
        - GOOGLE_SITE_VERIFICATION
        - BING_SITE_VERIFICATION
        - INDEXNOW_KEY
        - CONTENT_SIGNALS
    restart: unless-stopped
    ports:
      - "3011:3011"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
