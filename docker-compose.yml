services:
  # The website: a static export served by nginx (Dockerfile, deploy/nginx.conf).
  # Everything is decided when the image is built (the NEXT_PUBLIC_* values);
  # the container needs no secrets and no environment.
  web:
    build:
      context: .
      args:
        - NEXT_PUBLIC_API_KEY
        - NEXT_PUBLIC_SITE_URL
        - NEXT_PUBLIC_DEBUG_API
        - NEXT_PUBLIC_API_BACKEND_URL
        - NEXT_PUBLIC_SOURCE_URL
        - NEXT_PUBLIC_FALLBACK_LOCALE
        - NEXT_PUBLIC_SCROLL_TUNING
        - NEXT_PUBLIC_WEEK_ROLLOVER
        - NEXT_STALE_DYNAMIC
        - NEXT_STALE_STATIC
    restart: unless-stopped
    ports:
      - "3011:3011"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
